<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#234a57">
<title>Trip Together</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#20343a;--muted:#728086;--accent:#326b68;--soft:#e7f0ee;--line:#e3e8e6;--good:#27725b;--bad:#a34b4b;--warn:#a66a22}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding-bottom:88px}.top{padding:18px 16px 20px;background:linear-gradient(135deg,#244a55,#326b68);color:#fff;border-radius:0 0 24px 24px}
.topline,.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.brand{font-weight:850;font-size:21px}.tiny{font-size:12px;color:var(--muted)}.top .tiny{color:#d8e6e5}
.wrap{padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.hero{padding:18px}.muted{color:var(--muted)}
h1,h2,h3,p{margin-top:0}h1{font-size:25px;margin-bottom:5px}h2{font-size:18px;margin-bottom:12px}h3{font-size:15px;margin-bottom:8px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:750;cursor:pointer;min-height:42px}.btn.secondary{background:var(--soft);color:var(--accent)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#f7eaea;color:var(--bad)}.btn.small{min-height:32px;padding:6px 9px;font-size:12px}
input,select,textarea{width:100%;border:1px solid #dce3e0;border-radius:12px;background:#fff;color:var(--ink);padding:11px 12px;min-height:44px}textarea{min-height:76px;resize:vertical}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px;color:#536268}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f8faf9;border-radius:13px;padding:11px}.stat b{display:block;font-size:18px;margin-top:3px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{min-height:68px;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:12px;font-weight:750}.quick small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(980px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;padding:7px 2px;color:#7b8582;font-size:11px;font-weight:750}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--accent)}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:3px;margin:12px 0}.tabs button{white-space:nowrap;border:0;border-radius:999px;padding:8px 11px;background:#ecefed;color:#64716e;font-weight:750}.tabs button.active{background:var(--accent);color:#fff}
.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.amount{font-weight:850;white-space:nowrap}.pill,.status{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:800}.pill.important{background:#fff0dd;color:#9b5c13}
.avatar{width:38px;height:38px;border-radius:50%;background:#e6ecea;display:grid;place-items:center;font-weight:800;color:var(--accent);overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}
.tripcard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:10px}.tripgate{padding:18px}.tripgatehead{text-align:center;padding:10px 0}.joinhero{text-align:center;padding:22px 10px}.joinhero .avatar{width:64px;height:64px;margin:0 auto 12px;font-size:22px}
.pin{letter-spacing:.18em;text-align:center;font-weight:800}.notice{background:#fff8e9;color:#76551e;border-radius:13px;padding:11px;font-size:13px}.audit{font-size:11px;color:#8a9591;margin-top:4px}
.barrow{display:grid;grid-template-columns:110px 1fr 85px;gap:8px;align-items:center;margin:9px 0;font-size:12px}.bar{height:10px;border-radius:999px;background:#edf1ef;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.modal{position:fixed;inset:0;background:rgba(25,38,40,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--bg);width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.x{border:0;background:#e8ecea;border-radius:50%;width:36px;height:36px;font-size:20px}
.checkrow{display:flex;gap:8px;flex-wrap:wrap}.checkrow label{border:1px solid var(--line);border-radius:999px;padding:8px 10px;background:#fff;font-size:13px}.checkrow input{width:auto;min-height:0}.subitem{display:grid;grid-template-columns:1fr 100px 38px;gap:7px;margin-bottom:7px}.recent{font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions .btn{flex:1}
@media(min-width:700px){.quick{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.wrap{padding:18px}.modal{align-items:center}.sheet{border-radius:24px;max-height:84vh}}
@media(max-width:430px){.grid2,.grid3{grid-template-columns:1fr}.barrow{grid-template-columns:82px 1fr 72px}.subitem{grid-template-columns:1fr 88px 36px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="topline between"><div><div class="brand">Trip Together</div><div class="tiny">Plan less. Enjoy more.</div></div><button class="btn ghost" id="chooseBtn">Trips</button></div>
 <div id="accountBar" class="row" style="margin-top:12px"></div>
</header>
<main class="wrap" id="view"></main>
<nav class="nav" id="nav">
 <button data-v="home" class="active"><span>⌂</span>Home</button>
 <button data-v="activities"><span>◷</span>Activities</button>
 <button data-v="money"><span>₱</span>Expenses</button>
 <button data-v="group"><span>●</span>Group</button>
</nav>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle" style="margin:0"></h2><button class="x" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<script>
(()=>{'use strict';
const KEY='tripTogether_v7', OLD=['tripTogether_v6','tripTogether_v5','tripTogether_v4','tripTogether_v3','tripTogether_v2','tripTogether_v1'];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):'—';
const today=()=>new Date().toISOString().slice(0,10);
const timefmt=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap};
function seed(){return{active:null,currentUser:null,trips:{}}}
let raw=localStorage.getItem(KEY);if(!raw)for(const k of OLD){if(localStorage.getItem(k)){raw=localStorage.getItem(k);break}}
let data;try{data=raw?JSON.parse(raw):seed()}catch{data=seed()} if(!data?.trips)data=seed();
function normalize(t){t.people=t.people||[];t.program=t.program||[];t.items=t.items||[];t.expenses=t.expenses||[];t.payments=t.payments||[];t.sponsors=t.sponsors||[];t.transport=t.transport||[];t.potluck=t.potluck||[];t.history=t.history||[];t.tripCode=t.tripCode||'';return t}
Object.values(data.trips).forEach(normalize);
for(const [id,t] of Object.entries(data.trips)){if(t.place==='Batangas'&&t.start==='2026-12-18'&&t.end==='2026-12-20'&&t.people?.some(p=>p.name==='Alex'))delete data.trips[id]}
if(!data.active||!data.trips[data.active])data.active=Object.keys(data.trips)[0]||null;
let view='home', moneyTab='overview', gate=true, pendingTrip=null;
const trip=()=>data.active?data.trips[data.active]||null:null;
const me=()=>trip()?.people.find(p=>p.id===data.currentUser)||null;
const isSuper=()=>me()?.role==='Super Admin';
const member=id=>trip()?.people.find(p=>p.id===id);
const memberName=id=>member(id)?.name||id||'Unassigned';
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function log(text){let t=trip();if(!t)return;t.history.unshift({id:uid(),text,at:new Date().toISOString(),by:me()?.name||'System'});save()}
function initials(n){return(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function av(p){return `<div class="avatar">${p?.avatar?`<img src="${p.avatar}">`:esc(initials(p?.name))}</div>`}
function status(t){let x=today();if(!t.start||!t.end)return{label:'DATES NEEDED',sub:'Set trip dates'};if(x<t.start){let d=Math.ceil((new Date(t.start)-new Date(x))/864e5);return{label:'UPCOMING',sub:`${d} day${d===1?'':'s'} to go`}}if(x>t.end)return{label:'COMPLETED',sub:'Trip completed'};let d=Math.floor((new Date(x)-new Date(t.start))/864e5)+1;return{label:'ONGOING',sub:`Day ${d}`}}
function totalExpenses(t){return t.expenses.reduce((s,e)=>s+Number(e.amount||0),0)}
function totalFunds(t){return t.sponsors.reduce((s,e)=>s+Number(e.amount||0),0)}
function availableFund(t){return totalFunds(t)-totalExpenses(t)}
function balances(t){let b={};t.people.forEach(p=>b[p.id]=0);t.expenses.forEach(e=>{let ids=(e.shared||[]).filter(id=>id in b);if(!ids.length)return;let share=Number(e.amount||0)/ids.length;if(e.payer in b)b[e.payer]+=Number(e.amount||0);ids.forEach(id=>b[id]-=share)});t.payments.forEach(p=>{if(p.from in b)b[p.from]+=Number(p.amount||0);if(p.to in b)b[p.to]-=Number(p.amount||0)});return b}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function optionsPeople(sel=''){return trip().people.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('')}
function checksPeople(selected=[]){return trip().people.map(p=>`<label><input type="checkbox" name="shared" value="${p.id}" ${selected.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}
function renderAccount(){let t=trip(),p=me();$('#accountBar').innerHTML=t&&p?`${av(p)}<div class="grow"><b>${esc(t.name)}</b><div class="tiny">${esc(p.name)} · ${esc(p.role)}</div></div><button class="btn ghost small" id="logoutBtn">Switch</button>`:'';if($('#logoutBtn'))$('#logoutBtn').onclick=()=>{data.currentUser=null;save();render()}}
function render(){if(gate){picker();return}$('#nav').style.display='grid';renderAccount();$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===view));let t=trip();if(!t){gate=true;picker();return}if(!me()){joinGate(t);return}$('#view').innerHTML=view==='home'?home(t):view==='activities'?activities(t):view==='money'?money(t):group(t);bind()}
function picker(){gate=true;$('#nav').style.display='none';$('#accountBar').innerHTML='';let ts=Object.values(data.trips);$('#view').innerHTML=`<section class="tripgate"><div class="tripgatehead"><div class="eyebrow">Trip Together</div><h1>${ts.length?'Select a trip':'No trips yet'}</h1><p class="muted">${ts.length?'Choose the trip you want to join or open.':'Super Admin creates the first trip.'}</p></div>${ts.map(t=>`<div class="tripcard"><div class="avatar">✈</div><div class="grow"><b>${esc(t.name)}</b><div class="muted">${esc(t.place||'Destination not set')}</div><div class="tiny">${fmt(t.start)} – ${fmt(t.end)} · ${t.people.length} member${t.people.length===1?'':'s'}</div></div><button class="btn" data-pick="${t.id}">Select</button></div>`).join('')}<button class="btn secondary" style="width:100%;margin-top:14px" id="newTrip">＋ Create Trip</button></section>`;
$$('[data-pick]').forEach(b=>b.onclick=()=>{data.active=b.dataset.pick;pendingTrip=b.dataset.pick;data.currentUser=null;save();tripCodeGate()});$('#newTrip').onclick=newTrip}
function tripCodeGate(){let t=trip();$('#view').innerHTML=`<section class="card joinhero"><div class="avatar">🔐</div><div class="eyebrow">Join ${esc(t.name)}</div><h1>Enter Trip Pass Code</h1><p class="muted">Enter the 4–6 character pass code shared by the Super Admin.</p><form id="tripCodeForm"><div class="field"><input class="pin" name="code" maxlength="6" minlength="4" autocomplete="off" required placeholder="PASS CODE"></div><button class="btn" style="width:100%">Continue</button></form><button class="btn secondary" style="width:100%;margin-top:9px" id="backTrips">Back to Trips</button></section>`;
$('#backTrips').onclick=picker;$('#tripCodeForm').onsubmit=e=>{e.preventDefault();let code=new FormData(e.target).get('code').trim().toLowerCase();if(t.tripCode&&code!==t.tripCode.toLowerCase())return alert('Incorrect trip pass code.');joinGate(t)}
}
function joinGate(t){$('#nav').style.display='none';$('#accountBar').innerHTML='';$('#view').innerHTML=`<section class="card joinhero"><div class="avatar">👤</div><div class="eyebrow">${esc(t.name)}</div><h1>Member Access</h1><p class="muted">Existing member? Select your name. New member? Register once, then use your own PIN whenever you return.</p>${t.people.length?`<form id="memberLogin"><div class="field"><label>Your name</label><select name="id">${t.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Your personal PIN</label><input class="pin" name="pin" type="password" maxlength="6" minlength="4" required></div><button class="btn" style="width:100%">Enter Trip</button></form>`:''}<button class="btn secondary" style="width:100%;margin-top:9px" id="registerMember">Register as New Member</button><button class="btn ghost" style="width:100%;margin-top:9px" id="backToTrips">Choose Another Trip</button></section>`;
if($('#memberLogin'))$('#memberLogin').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=t.people.find(x=>x.id===f.get('id'));if(!p||String(p.pin)!==String(f.get('pin')))return alert('Incorrect personal PIN.');data.currentUser=p.id;gate=false;save();render()};
$('#registerMember').onclick=registerMember;$('#backToTrips').onclick=picker}
function registerMember(){let t=trip();openModal('Register for '+t.name,`<form id="regForm"><div class="field"><label>Your name</label><input name="name" required placeholder="Full name"></div><div class="field"><label>Create your personal 4–6 character PIN</label><input class="pin" name="pin" type="password" minlength="4" maxlength="6" pattern="[A-Za-z0-9]{4,6}" required placeholder="Letters or numbers"></div><div class="field"><label>Photo (optional)</label><input name="avatar" type="file" accept="image/*"></div><button class="btn" style="width:100%">Register & Enter Trip</button></form>`);
$('#regForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),pin=String(f.get('pin'));if(t.people.some(p=>p.name.trim().toLowerCase()===name.toLowerCase()))return alert('That name is already registered in this trip. Select the existing name instead.');let p={id:uid(),name,role:'Member',pin,avatar:''};let file=e.target.avatar.files[0];if(file)p.avatar=await fileData(file);t.people.push(p);data.currentUser=p.id;log(`${name} joined the trip`);gate=false;closeModal();render()}}
function newTrip(){openModal('Create Trip',`<form id="newTripForm"><div class="field"><label>Trip name</label><input name="name" required placeholder="Amarisa"></div><div class="field"><label>Destination</label><input name="place"></div><div class="grid2"><div class="field"><label>Start date</label><input name="start" type="date" required></div><div class="field"><label>End date</label><input name="end" type="date" required></div></div><div class="field"><label>Trip pass code · 4–6 letters or numbers</label><input class="pin" name="tripCode" minlength="4" maxlength="6" pattern="[A-Za-z0-9]{4,6}" required placeholder="Shared with members"></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="field"><label>Super Admin name</label><input name="adminName" required></div><div class="field"><label>Your personal PIN · 4–6 letters or numbers</label><input class="pin" name="adminPin" type="password" minlength="4" maxlength="6" pattern="[A-Za-z0-9]{4,6}" required></div><button class="btn" style="width:100%">Create Trip</button></form>`);
$('#newTripForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('end')<f.get('start'))return alert('End date cannot be before start date.');let id=uid(),aid=uid();data.trips[id]=normalize({id,name:f.get('name').trim(),place:f.get('place').trim(),start:f.get('start'),end:f.get('end'),tripCode:String(f.get('tripCode')),people:[{id:aid,name:f.get('adminName').trim(),role:'Super Admin',pin:String(f.get('adminPin')),avatar:''}],program:[],items:[],expenses:[],payments:[],sponsors:[],transport:[],potluck:[],history:[{id:uid(),text:'Trip created',at:new Date().toISOString(),by:f.get('adminName').trim()}]});data.active=id;data.currentUser=aid;gate=false;save();closeModal();render()}}
function home(t){let st=status(t),recent=t.history.slice(0,5),b=balances(t),spend=[...t.people].map(p=>({p,v:t.expenses.filter(e=>e.payer===p.id).reduce((s,e)=>s+Number(e.amount||0),0)})).sort((a,b)=>b.v-a.v),mx=Math.max(1,...spend.map(x=>x.v)),bal=[...t.people].map(p=>({p,v:Math.abs(b[p.id]||0)})).sort((a,b)=>b.v-a.v),mb=Math.max(1,...bal.map(x=>x.v));return `<section class="card hero"><div class="eyebrow">${esc(t.place||'Trip')}</div><h1>${esc(t.name)}</h1><div class="row between"><span class="status">${st.label}</span><b>${esc(st.sub)}</b></div></section>
<section class="stats"><div class="stat"><span class="tiny">Current expenses</span><b>${peso(totalExpenses(t))}</b></div><div class="stat"><span class="tiny">Available fund</span><b>${peso(availableFund(t))}</b></div><div class="stat"><span class="tiny">Funding / sponsors</span><b>${peso(totalFunds(t))}</b></div><div class="stat"><span class="tiny">Members</span><b>${t.people.length}</b></div></section>
<section><h2>Quick actions</h2><div class="quick"><button data-act="expense">💸 Add Expense<small>Purchase or payment</small></button><button data-act="purchase">🛒 Add Purchase<small>Multiple item breakdown</small></button><button data-act="activity">＋ Add Activity<small>Regular or important</small></button><button data-act="potluck">🍲 Add Potluck<small>Food + meal schedule</small></button><button data-act="fund">＋ Add Fund<small>Sponsor / contribution</small></button><button data-act="potluck">🍲 Add Potluck<small>Food someone will bring</small></button></div></section>
<section class="card" style="margin-top:14px"><h2>Most Expenses Paid</h2>${spend.slice(0,5).map(x=>`<div class="barrow"><span>${esc(x.p.name)}</span><div class="bar"><i style="width:${x.v/mx*100}%"></i></div><b>${peso(x.v)}</b></div>`).join('')||'<div class="muted">No expenses yet.</div>'}</section>
<section class="card"><h2>Largest Balances</h2>${bal.slice(0,5).map(x=>`<div class="barrow"><span>${esc(x.p.name)}</span><div class="bar"><i style="width:${x.v/mb*100}%"></i></div><b>${peso(x.v)}</b></div>`).join('')||'<div class="muted">No balances yet.</div>'}</section>
<section class="card"><h2>Recent Updates</h2>${recent.length?recent.map(x=>`<div class="item recent"><b>${esc(x.text)}</b><div class="tiny">${new Date(x.at).toLocaleString('en-PH')} · ${esc(x.by||'')}</div></div>`).join(''):'<div class="muted">No updates yet.</div>'}</section>`}
function activities(t){let days=[...new Set(t.program.map(x=>x.date))].sort();return `<section class="row between"><div><h1 style="margin-bottom:3px">Activities</h1><div class="muted">Trip activities, schedule and meal potluck</div></div><button class="btn" data-act="activity">＋ Activity</button></section>
<section class="card" style="margin-top:14px"><div class="row between"><div><h2 style="margin-bottom:3px">🍽️ Potluck & Meal Plan</h2><div class="muted">Food, member bringing it, date, and meal to be served.</div></div><button class="btn secondary small" data-act="potluck">＋ Potluck</button></div>
${t.potluck.length?t.potluck.slice().sort((a,b)=>(a.date+a.meal).localeCompare(b.date+b.meal)).map(x=>`<div class="item row"><div class="grow"><div class="row"><b>${esc(x.food)}</b><span class="pill">${esc(x.meal)}</span></div><div class="muted">${fmt(x.date)} · Brought by ${esc(memberName(x.by))}${x.qty?' · '+esc(x.qty):''}</div>${x.note?`<div class="tiny">${esc(x.note)}</div>`:''}</div>${isSuper()?`<button class="btn danger small" data-delpot="${x.id}">Delete</button>`:''}</div>`).join(''):'<div class="muted" style="margin-top:12px">No potluck entries yet.</div>'}</section>
<section class="card">${days.length?days.map(d=>`<h3 style="margin-top:12px">${fmt(d)}</h3>${t.program.filter(x=>x.date===d).sort((a,b)=>a.start.localeCompare(b.start)).map(a=>`<div class="item row"><div class="grow"><div class="row"><b>${esc(a.title)}</b><span class="pill ${a.priority==='Important'?'important':''}">${esc(a.priority||'Regular')}</span></div><div class="muted">${timefmt(a.start)}${a.end?' – '+timefmt(a.end):''}${a.place?' · '+esc(a.place):''}</div><div class="audit">Added by ${esc(memberName(a.by))}</div></div>${isSuper()?`<button class="btn danger small" data-delact="${a.id}">Delete</button>`:''}</div>`).join('')}`).join(''):'<div class="muted">No activities yet.</div>'}</section>`}
function money(t){let b=balances(t);return `<section><h1 style="margin-bottom:3px">Expenses & Funds</h1><div class="muted">Expenses, purchases, funding, payments and transportation</div></section><div class="tabs"><button data-mtab="overview" class="${moneyTab==='overview'?'active':''}">Overview</button><button data-mtab="expenses" class="${moneyTab==='expenses'?'active':''}">Expenses</button><button data-mtab="funds" class="${moneyTab==='funds'?'active':''}">Funding</button><button data-mtab="payments" class="${moneyTab==='payments'?'active':''}">Payments</button><button data-mtab="transport" class="${moneyTab==='transport'?'active':''}">Transportation</button></div>${moneyTab==='overview'?`<section class="stats"><div class="stat"><span class="tiny">Expenses</span><b>${peso(totalExpenses(t))}</b></div><div class="stat"><span class="tiny">Funds</span><b>${peso(totalFunds(t))}</b></div><div class="stat"><span class="tiny">Available Fund</span><b>${peso(availableFund(t))}</b></div><div class="stat"><span class="tiny">Payments</span><b>${peso(t.payments.reduce((s,x)=>s+Number(x.amount||0),0))}</b></div></section><section class="card" style="margin-top:12px"><h2>Member Balances</h2>${t.people.map(p=>`<div class="item row between"><span>${esc(p.name)}</span><b>${(b[p.id]||0)>=0?'Gets ':'Owes '}${peso(Math.abs(b[p.id]||0))}</b></div>`).join('')}</section>`:moneyTab==='expenses'?`<section class="row between"><h2>Expenses & Purchases</h2><div><button class="btn secondary small" data-act="purchase">Purchase</button> <button class="btn small" data-act="expense">Expense</button></div></section><section class="card">${t.expenses.length?t.expenses.map(e=>`<div class="item"><div class="row between"><div class="grow"><b>${esc(e.name)}</b><div class="muted">Paid by ${esc(memberName(e.payer))} · ${fmt(e.date)}</div>${e.lines?.length?`<div class="tiny">${e.lines.map(l=>`${esc(l.name)} ${peso(l.amount)}`).join(' · ')}</div>`:''}</div><span class="amount">${peso(e.amount)}</span>${isSuper()?`<button class="btn danger small" data-delexp="${e.id}">Delete</button>`:''}</div></div>`).join(''):'<div class="muted">No expenses yet.</div>'}</section>`:moneyTab==='funds'?`<section class="row between"><h2>Funding / Sponsorship</h2><button class="btn" data-act="fund">＋ Fund</button></section><section class="card">${t.sponsors.length?t.sponsors.map(s=>`<div class="item row between"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.type||'Contribution')} · ${fmt(s.date)}</div></div><b>${peso(s.amount)}</b></div>`).join(''):'<div class="muted">No funding yet.</div>'}</section>`:moneyTab==='payments'?`<section class="row between"><h2>Payments / Settlements</h2><button class="btn" data-act="payment">＋ Payment</button></section><section class="card">${t.payments.length?t.payments.map(p=>`<div class="item row between"><div><b>${esc(memberName(p.from))} → ${esc(memberName(p.to))}</b><div class="muted">${esc(p.method||'Payment')} · ${fmt(p.date)}</div></div><b>${peso(p.amount)}</b></div>`).join(''):'<div class="muted">No payments yet.</div>'}</section>`:`<section class="row between"><h2>Transportation Costs</h2><button class="btn" data-act="transport">＋ Transport</button></section><section class="card">${t.transport.length?t.transport.map(x=>`<div class="item row between"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.note||'')} · ${fmt(x.date)}</div></div><b>${peso(x.amount)}</b></div>`).join(''):'<div class="muted">No transportation costs yet.</div>'}</section>`}`}
function group(t){return `<section class="row between"><div><h1 style="margin-bottom:3px">Group</h1><div class="muted">${t.people.length} registered member${t.people.length===1?'':'s'}</div></div>${isSuper()?'<button class="btn secondary" id="shareTrip">Share Trip</button>':''}</section><section class="card" style="margin-top:14px">${t.people.map(p=>`<div class="item row">${av(p)}<div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.role)}</div></div>${isSuper()&&p.role!=='Super Admin'?`<button class="btn danger small" data-delperson="${p.id}">Remove</button>`:''}</div>`).join('')}</section>${isSuper()?`<section class="card"><h2>Trip Access</h2><div class="field"><label>Trip pass code</label><input value="${esc(t.tripCode||'Not set')}" readonly></div><button class="btn secondary" id="changeTripCode">Change Pass Code</button><p class="tiny" style="margin-top:10px">Members use this trip code first, then their own personal PIN for future access.</p></section>`:''}`}
function formActivity(){let mins=['00','05','10','15','20','25','30','35','40','45','50','55'];let times=[];for(let h=0;h<24;h++)for(const m of mins)times.push(String(h).padStart(2,'0')+':'+m);let opts=times.map(x=>`<option value="${x}">${timefmt(x)}</option>`).join('');openModal('Add Activity',`<form id="activityForm"><div class="field"><label>Activity</label><input name="title" required></div><div class="grid2"><div class="field"><label>Date</label><input name="date" type="date" required min="${trip().start||''}" max="${trip().end||''}"></div><div class="field"><label>Importance</label><select name="priority"><option>Regular</option><option>Important</option></select></div></div><div class="grid2"><div class="field"><label>Start time</label><select name="start">${opts}</select></div><div class="field"><label>End time</label><select name="end"><option value="">—</option>${opts}</select></div></div><div class="field"><label>Location</label><input name="place"></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div><button class="btn" style="width:100%">Add Activity</button></form>`);$('#activityForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);trip().program.push({id:uid(),title:f.get('title'),date:f.get('date'),start:f.get('start'),end:f.get('end'),priority:f.get('priority'),place:f.get('place'),note:f.get('note'),by:me().id});log(`Activity added: ${f.get('title')}`);closeModal();render()}}
function formPotluck(){let meals=['Breakfast','Brunch','Lunch','AM Snack','PM Snack','Dinner','Midnight Snack'];openModal('Add Potluck / Food',`<form id="potluckForm"><div class="field"><label>Food / Dish</label><input name="food" required placeholder="e.g. Sopas"></div><div class="grid2"><div class="field"><label>Who will bring it?</label><select name="by">${optionsPeople(me().id)}</select></div><div class="field"><label>Quantity / Serving</label><input name="qty" placeholder="e.g. 1 large pot"></div></div><div class="grid2"><div class="field"><label>Date to be served</label><input name="date" type="date" required min="${trip().start||''}" max="${trip().end||''}"></div><div class="field"><label>Meal</label><select name="meal">${meals.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Optional serving/preparation notes"></textarea></div><button class="btn" style="width:100%">Add to Potluck</button></form>`);$('#potluckForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:uid(),food:f.get('food').trim(),by:f.get('by'),qty:f.get('qty').trim(),date:f.get('date'),meal:f.get('meal'),note:f.get('note').trim()};trip().potluck.push(x);log(`Potluck added: ${x.food} · ${x.meal} · ${fmt(x.date)} · ${memberName(x.by)}`);closeModal();render()}}
function formExpense(){openModal('Add Expense',`<form id="expenseForm"><div class="field"><label>Description</label><input name="name" required></div><div class="grid2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div></div><div class="field"><label>Paid by</label><select name="payer">${optionsPeople(me().id)}</select></div><div class="field"><label>Split among</label><div class="checkrow">${checksPeople(trip().people.map(p=>p.id))}</div></div><button class="btn" style="width:100%">Save Expense</button></form>`);$('#expenseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),shared=[...e.target.querySelectorAll('[name=shared]:checked')].map(x=>x.value);trip().expenses.push({id:uid(),name:f.get('name'),amount:Number(f.get('amount')),date:f.get('date'),payer:f.get('payer'),shared});log(`Expense added: ${f.get('name')} · ${peso(f.get('amount'))}`);closeModal();render()}}
function formPurchase(){openModal('Add Purchase',`<form id="purchaseForm"><div class="field"><label>Purchase / group name</label><input name="name" required placeholder="Ingredients for Adobo"></div><div class="field"><label>Item breakdown</label><div id="lines"><div class="subitem"><input name="lineName" required placeholder="e.g. Chicken"><input name="lineAmount" type="number" min="0" step=".01" required placeholder="Amount"><button type="button" class="btn secondary addline">＋</button></div></div></div><div class="grid2"><div class="field"><label>Paid by</label><select name="payer">${optionsPeople(me().id)}</select></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div></div><div class="field"><label>Split among</label><div class="checkrow">${checksPeople(trip().people.map(p=>p.id))}</div></div><button class="btn" style="width:100%">Save Purchase</button></form>`);function wire(){ $$('.addline').forEach(b=>b.onclick=()=>{b.textContent='×';b.classList.remove('addline','secondary');b.classList.add('danger','remline');b.onclick=()=>b.parentElement.remove();$('#lines').insertAdjacentHTML('beforeend','<div class="subitem"><input name="lineName" required placeholder="Item"><input name="lineAmount" type="number" min="0" step=".01" required placeholder="Amount"><button type="button" class="btn secondary addline">＋</button></div>');wire()})}wire();$('#purchaseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),names=f.getAll('lineName'),amts=f.getAll('lineAmount').map(Number),lines=names.map((name,i)=>({name,amount:amts[i]})),amount=amts.reduce((s,x)=>s+x,0),shared=[...e.target.querySelectorAll('[name=shared]:checked')].map(x=>x.value);trip().expenses.push({id:uid(),name:f.get('name'),amount,date:f.get('date'),payer:f.get('payer'),shared,lines});log(`Purchase added: ${f.get('name')} · ${lines.length} item${lines.length===1?'':'s'} · ${peso(amount)}`);closeModal();render()}}
function formPotluck(){openModal('Add Potluck / Food',`<form id="potluckForm"><div class="field"><label>Food / Item</label><input name="name" required placeholder="Baked Sushi / Adobo / Drinks"></div><div class="grid2"><div class="field"><label>Quantity / Serving</label><input name="qty" placeholder="2 trays / 1 pot"></div><div class="field"><label>Bringing by</label><select name="by">${optionsPeople(me().id)}</select></div></div><div class="field"><label>Status</label><select name="status"><option>Planned</option><option>Confirmed</option><option>Brought</option><option>Needs to Buy</option></select></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Optional details"></textarea></div><button class="btn" style="width:100%">Add to Potluck</button></form>`);$('#potluckForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);trip().items.push({id:uid(),name:f.get('name'),qty:f.get('qty'),by:f.get('by'),status:f.get('status'),note:f.get('note'),createdBy:me().id});log(`Potluck added: ${f.get('name')} · ${memberName(f.get('by'))}`);closeModal();render()}}
function formFund(){openModal('Add Funding / Sponsor',`<form id="fundForm"><div class="field"><label>Source / Sponsor</label><input name="name" required></div><div class="grid2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required></div><div class="field"><label>Type</label><select name="type"><option>Sponsorship</option><option>Member Contribution</option><option>Other Fund</option></select></div></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><button class="btn" style="width:100%">Add Fund</button></form>`);$('#fundForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);trip().sponsors.push({id:uid(),name:f.get('name'),amount:Number(f.get('amount')),type:f.get('type'),date:f.get('date')});log(`Fund added: ${f.get('name')} · ${peso(f.get('amount'))}`);closeModal();render()}}
function formPayment(){openModal('Record Payment',`<form id="payForm"><div class="grid2"><div class="field"><label>From</label><select name="from">${optionsPeople(me().id)}</select></div><div class="field"><label>To</label><select name="to">${optionsPeople()}</select></div></div><div class="grid2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required></div><div class="field"><label>Method</label><select name="method"><option>Cash</option><option>GCash</option><option>Bank</option><option>Other</option></select></div></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><button class="btn" style="width:100%">Record Payment</button></form>`);$('#payForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('from')===f.get('to'))return alert('From and To must be different.');trip().payments.push({id:uid(),from:f.get('from'),to:f.get('to'),amount:Number(f.get('amount')),method:f.get('method'),date:f.get('date')});log(`Payment recorded: ${memberName(f.get('from'))} → ${memberName(f.get('to'))} · ${peso(f.get('amount'))}`);closeModal();render()}}
function formTransport(){openModal('Add Transportation Cost',`<form id="transportForm"><div class="field"><label>Transportation</label><input name="name" required placeholder="Van rental / Gas / Toll"></div><div class="grid2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div></div><div class="field"><label>Notes</label><input name="note"></div><button class="btn" style="width:100%">Save</button></form>`);$('#transportForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let amount=Number(f.get('amount'));trip().transport.push({id:uid(),name:f.get('name'),amount,date:f.get('date'),note:f.get('note')});trip().expenses.push({id:uid(),name:'Transport: '+f.get('name'),amount,date:f.get('date'),payer:me().id,shared:trip().people.map(p=>p.id)});log(`Transportation cost added: ${f.get('name')} · ${peso(amount)}`);closeModal();render()}}
function shareTrip(){let t=trip(),url=location.origin+location.pathname+'?trip='+encodeURIComponent(t.id);openModal('Share '+t.name,`<div class="notice">Share this link and the Trip Pass Code with your members.</div><div class="field" style="margin-top:12px"><label>Trip link</label><input id="shareUrl" value="${esc(url)}" readonly></div><div class="field"><label>Trip pass code</label><input value="${esc(t.tripCode||'Not set')}" readonly></div><button class="btn" style="width:100%" id="copyShare">Copy Link</button><p class="tiny" style="margin-top:10px">Important: this GitHub Pages version still stores records in each browser. The access flow is ready, but true live sharing between different phones requires a shared online database.</p>`);$('#copyShare').onclick=async()=>{try{await navigator.clipboard.writeText(url);alert('Trip link copied.')}catch{prompt('Copy this link:',url)}}}
function changeTripCode(){let t=trip();openModal('Change Trip Pass Code',`<form id="codeForm"><div class="field"><label>New 4–6 character code</label><input class="pin" name="code" minlength="4" maxlength="6" pattern="[A-Za-z0-9]{4,6}" required></div><button class="btn" style="width:100%">Save</button></form>`);$('#codeForm').onsubmit=e=>{e.preventDefault();t.tripCode=new FormData(e.target).get('code');log('Trip pass code changed by Super Admin');closeModal();render()}}
function fileData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function bind(){$$('[data-act]').forEach(b=>b.onclick=()=>({expense:formExpense,purchase:formPurchase,activity:formActivity,fund:formFund,payment:formPayment,transport:formTransport,potluck:formPotluck}[b.dataset.act]?.()));$$('[data-mtab]').forEach(b=>b.onclick=()=>{moneyTab=b.dataset.mtab;render()});$$('[data-delact]').forEach(b=>b.onclick=()=>{let x=trip().program.find(a=>a.id===b.dataset.delact);if(isSuper()&&x&&confirm('Delete this activity?')){trip().program=trip().program.filter(a=>a.id!==x.id);log('Activity deleted: '+x.title);render()}});$$('[data-delpot]').forEach(b=>b.onclick=()=>{let x=trip().potluck.find(a=>a.id===b.dataset.delpot);if(isSuper()&&x&&confirm('Delete this potluck entry?')){trip().potluck=trip().potluck.filter(a=>a.id!==x.id);log('Potluck deleted: '+x.food);render()}});$$('[data-delexp]').forEach(b=>b.onclick=()=>{let x=trip().expenses.find(a=>a.id===b.dataset.delexp);if(isSuper()&&x&&confirm('Delete this expense?')){trip().expenses=trip().expenses.filter(a=>a.id!==x.id);log('Expense deleted: '+x.name);render()}});$$('[data-delperson]').forEach(b=>b.onclick=()=>{let p=member(b.dataset.delperson);if(isSuper()&&p&&confirm('Remove '+p.name+'?')){trip().people=trip().people.filter(x=>x.id!==p.id);log('Member removed: '+p.name);render()}});$$('[data-delitem]').forEach(b=>b.onclick=()=>{let x=trip().items.find(a=>a.id===b.dataset.delitem);if(isSuper()&&x&&confirm('Delete this potluck item?')){trip().items=trip().items.filter(a=>a.id!==x.id);log('Potluck item deleted: '+x.name);render()}});if($('#potluckJump'))$('#potluckJump').onclick=()=>$('#potluckSection')?.scrollIntoView({behavior:'smooth'});if($('#shareTrip'))$('#shareTrip').onclick=shareTrip;if($('#changeTripCode'))$('#changeTripCode').onclick=changeTripCode}
$('#nav').onclick=e=>{let b=e.target.closest('button[data-v]');if(b){view=b.dataset.v;render()}};$('#chooseBtn').onclick=()=>{gate=true;data.currentUser=null;save();picker()};$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
const requested=new URLSearchParams(location.search).get('trip');if(requested&&data.trips[requested]){data.active=requested;pendingTrip=requested;save();gate=true;setTimeout(tripCodeGate,0)}else render();
save();
})();
</script>
</body></html>
