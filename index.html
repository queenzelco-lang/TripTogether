(()=>{'use strict';const KEY='tripTogether_v5';const oldKeys=['tripTogether_v4','tripTogether_v3'];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});const isoToday=()=>new Date().toISOString().slice(0,10);const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):'—';const timefmt=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap};
function seed(){return {active:'t1',trips:{t1:{id:'t1',name:'Sample Beach Getaway',place:'Batangas',start:'2026-12-18',end:'2026-12-20',people:[{id:'p1',name:'Admin',role:'Super Admin',avatar:''},{id:'p2',name:'Alex',role:'Editor',avatar:''},{id:'p3',name:'Sam',role:'Viewer',avatar:''}],program:[{id:uid(),date:'2026-12-18',start:'14:00',end:'15:00',title:'Check-in',place:'Villa',by:'Admin'},{id:uid(),date:'2026-12-19',start:'08:00',end:'10:00',title:'Pickleball',place:'Garden',by:'Alex'}],items:[{id:uid(),kind:'potluck',name:'Baked Sushi',by:'Alex',qty:'2 trays',status:'planned',cost:0},{id:uid(),kind:'need',name:'Drinking Water',by:'',qty:'2 cases',status:'needed',cost:0}],expenses:[{id:uid(),name:'Accommodation deposit',amount:5000,payer:'p1',shared:['p1','p2','p3'],date:'2026-12-18',note:'',receipt:'',createdBy:'Admin',updatedAt:new Date().toISOString()},{id:uid(),name:'Gas',amount:1800,payer:'p2',shared:['p1','p2','p3'],date:'2026-12-18',note:'',receipt:'',createdBy:'Alex',updatedAt:new Date().toISOString()}],payments:[],sponsors:[],history:[{id:uid(),text:'Trip created',at:new Date().toISOString()}]}}}}
let raw=localStorage.getItem(KEY);if(!raw){for(const k of oldKeys){if(localStorage.getItem(k)){raw=localStorage.getItem(k);break}}}let data;try{data=raw?JSON.parse(raw):seed()}catch(e){data=seed()}if(!data.trips||!Object.keys(data.trips).length)data=seed();let view='home',moneyTab='expenses';const trip=()=>data.trips[data.active]||Object.values(data.trips)[0];function normalize(t){t.people=t.people||[];t.program=t.program||[];t.items=t.items||[];t.expenses=t.expenses||[];t.payments=t.payments||[];t.sponsors=t.sponsors||[];t.history=t.history||[];return t}Object.values(data.trips).forEach(normalize);if(!('currentUser' in data)){let ct=data.trips[data.active];data.currentUser=ct?.people?.find(p=>p.role==='Super Admin')?.id||ct?.people?.[0]?.id||null}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function log(text){trip().history.unshift({id:uid(),text,at:new Date().toISOString()});save()}function roleCanEdit(){return true}function initials(n){return (n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function av(p){return `<div class="avatar">${p?.avatar?`<img src="${p.avatar}" alt="">`:esc(initials(p?.name))}</div>`}function status(t){let x=isoToday();if(!t.start||!t.end)return {label:'DATES NEEDED',sub:'Set your trip dates'};if(x<t.start){let d=Math.ceil((new Date(t.start)-new Date(x))/864e5);return{label:'UPCOMING',sub:`${d} day${d===1?'':'s'} to go`}}if(x>t.end)return{label:'COMPLETED',sub:'Trip completed'};let day=Math.floor((new Date(x)-new Date(t.start))/864e5)+1,total=Math.floor((new Date(t.end)-new Date(t.start))/864e5)+1;return{label:'ONGOING',sub:`Day ${day} of ${total}`}}
function sharedExpenses(t){return t.expenses.filter(e=>(e.shared||[]).length>0)}function totalShared(t){return sharedExpenses(t).reduce((s,e)=>s+Number(e.amount||0),0)}function totalSponsors(t){return (t.sponsors||[]).reduce((s,x)=>s+Number(x.amount||0),0)}function balances(t){let b={};t.people.forEach(p=>b[p.id]=0);sharedExpenses(t).forEach(e=>{let ids=(e.shared||[]).filter(id=>id in b);if(!ids.length)return;let share=Number(e.amount||0)/ids.length;if(e.payer in b)b[e.payer]+=Number(e.amount||0);ids.forEach(id=>b[id]-=share)});let sponsor=totalSponsors(t);if(sponsor>0){let neg=Object.entries(b).filter(([,v])=>v<0),owed=neg.reduce((s,[,v])=>s-v,0);if(owed>0)neg.forEach(([id,v])=>b[id]+=sponsor*((-v)/owed))}(t.payments||[]).forEach(p=>{if(p.from in b)b[p.from]+=Number(p.amount||0);if(p.to in b)b[p.to]-=Number(p.amount||0)});return b}function settlePairs(t){let b=balances(t),debt=Object.entries(b).filter(([,v])=>v<-.01).map(([id,v])=>[id,-v]),cred=Object.entries(b).filter(([,v])=>v>.01).map(([id,v])=>[id,v]),out=[];let i=0,j=0;while(i<debt.length&&j<cred.length){let a=Math.min(debt[i][1],cred[j][1]);if(a>.01)out.push({from:debt[i][0],to:cred[j][0],amount:a});debt[i][1]-=a;cred[j][1]-=a;if(debt[i][1]<.01)i++;if(cred[j][1]<.01)j++}return out}function person(id){return trip().people.find(p=>p.id===id)}
function renderSelect(){let s=$('#tripSelect');s.innerHTML=Object.values(data.trips).map(t=>`<option value="${t.id}" ${t.id===data.active?'selected':''}>${esc(t.name)}</option>`).join('')}function currentPerson(){return trip().people.find(p=>p.id===data.currentUser)}function isSuper(){return currentPerson()?.role==='Super Admin'}function memberName(idOrName){let p=trip().people.find(p=>p.id===idOrName||p.name===idOrName);return p?.name||idOrName||'Unassigned'}function renderAccount(){let p=currentPerson(),bar=$('#accountBar');bar.innerHTML=p?`${av(p)}<div class="grow"><b>${esc(p.name)}</b><div class="tiny">${esc(p.role)} · My account</div></div><button class="btn ghost" id="switchAccount">Switch</button>`:`<div class="grow"><b>Not joined yet</b><div class="tiny">Create your trip profile to participate</div></div><button class="btn ghost" id="switchAccount">Join</button>`;$('#switchAccount').onclick=accountChooser}function render(){renderSelect();renderAccount();$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===view));let t=normalize(trip());$('#view').innerHTML=currentPerson()?(view==='home'?home(t):view==='trip'?tripView(t):view==='money'?money(t):group(t)):joinView(t);bindView()}
function home(t){let st=status(t),today=isoToday(),events=t.program.filter(x=>x.date===today).sort((a,b)=>a.start.localeCompare(b.start)),next=events[0];return `<section class="card hero"><div class="eyebrow">${esc(t.place||'Your next trip')}</div><h1>${esc(t.name)}</h1><p class="muted">${fmt(t.start)} – ${fmt(t.end)}</p><div class="row between"><span class="status">${st.label}</span><b>${esc(st.sub)}</b></div></section><section><h2>Quick actions</h2><div class="quick"><button data-act="expense">💸 Add Expense<small>Who paid & who shares</small></button><button data-act="potluck">🍱 I’ll Bring Something<small>Add to potluck</small></button><button data-act="activity">＋ Add Activity<small>Update the program</small></button><button data-act="need">🛒 Add Needed Item<small>Groceries & supplies</small></button></div></section><section class="card" style="margin-top:14px"><div class="row between"><h2 style="margin:0">${status(t).label==='ONGOING'?"Today's Program":'Program'}</h2><button class="btn secondary" data-go="trip">View all</button></div>${next?`<div class="item"><div class="eventtime">${timefmt(next.start)}${next.end?' – '+timefmt(next.end):''}</div><b>${esc(next.title)}</b><div class="muted">📍 ${esc(next.place||'Location not set')}</div></div>`:`<div class="empty">No activities ${status(t).label==='ONGOING'?'today':'shown yet'}.</div>`}</section><section class="card"><div class="row between"><h2 style="margin:0">Trip money</h2><button class="btn secondary" data-go="money">Open</button></div><div class="stats" style="margin-top:12px"><div class="stat"><span class="tiny">Shared expenses</span><b>${peso(totalShared(t))}</b></div><div class="stat"><span class="tiny">Payments</span><b>${peso(t.payments.reduce((s,p)=>s+Number(p.amount||0),0))}</b></div></div></section>`}
function tripView(t){let days=[...new Set(t.program.map(x=>x.date).concat(t.start?t.start:[]))].filter(Boolean).sort();let items=t.items||[];return `<section class="row between"><div><h1 style="margin-bottom:3px">Trip</h1><div class="muted">Program, food & things you need</div></div><button class="btn secondary" data-act="edittrip">Edit dates</button></section><section class="card" style="margin-top:14px"><div class="row between"><h2 style="margin:0">Program</h2><button class="btn" data-act="activity">＋ Activity</button></div>${days.length?days.map((d,i)=>{let es=t.program.filter(x=>x.date===d).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="dayhead"><h3>${d===isoToday()?'TODAY · ':''}${fmt(d)}</h3><span class="pill">${es.length} activit${es.length===1?'y':'ies'}</span></div><div class="program">${es.map(e=>`<div class="event"><div class="row between"><div class="grow"><div class="eventtime">${timefmt(e.start)}${e.end?' – '+timefmt(e.end):''}</div><b>${esc(e.title)}</b><div class="muted">${e.place?'📍 '+esc(e.place):''}</div><div class="audit">Added by ${esc(memberName(e.by))}</div></div>${isSuper()?`<button class="btn danger small" data-del-activity="${e.id}">Delete</button>`:''}</div></div>`).join('')||'<div class="empty">No activity</div>'}</div>`}).join(''):'<div class="empty">No activities yet. Add the first one.</div>'}</section><section class="card"><div class="row between"><h2 style="margin:0">Potluck & Needed Items</h2><button class="btn secondary" data-act="potluck">＋ Add</button></div>${items.length?items.map(x=>`<div class="item row"><div class="grow"><div><span class="pill">${x.kind==='potluck'?'Potluck':'Needed'}</span> <b>${esc(x.name)}</b></div><div class="muted">${x.by?'By '+esc(memberName(x.by)):'Unassigned'}${x.qty?' · '+esc(x.qty):''}</div></div><div class="row">${x.status==='bought'?`<span class="pill">Bought ${x.cost?peso(x.cost):''}</span>`:`<button class="btn secondary small" data-buy="${x.id}">Bought</button>`}${isSuper()?`<button class="btn danger small" data-del-item="${x.id}">Delete</button>`:''}</div></div>`).join(''):'<div class="empty">Nothing listed yet.</div>'}</section>`}
function money(t){let b=balances(t),pairs=settlePairs(t);return `<section><h1 style="margin-bottom:3px">Expenses</h1><div class="muted">Transparent trip spending and settlement</div></section><div class="tabs" style="margin-top:14px"><button data-mtab="expenses" class="${moneyTab==='expenses'?'active':''}">Expenses</button><button data-mtab="balances" class="${moneyTab==='balances'?'active':''}">Balances</button><button data-mtab="payments" class="${moneyTab==='payments'?'active':''}">Payments</button><button data-mtab="history" class="${moneyTab==='history'?'active':''}">Activity</button></div>${moneyTab==='expenses'?`<section class="card"><div class="row between"><div><div class="tiny">TOTAL SHARED</div><h1 style="margin:2px 0">${peso(totalShared(t))}</h1></div><button class="btn" data-act="expense">＋ Expense</button></div>${t.expenses.length?t.expenses.slice().reverse().map(e=>{let p=person(e.payer),personal=!(e.shared||[]).length;return `<div class="item row">${av(p)}<div class="grow"><b>${esc(e.name)}</b><div class="muted">${fmt(e.date)} · Paid by ${esc(p?.name||'Unknown')}</div><div class="audit">${personal?'Personal / not shared':`Split with ${(e.shared||[]).length} traveler(s)`}${e.updatedAt?' · Updated '+new Date(e.updatedAt).toLocaleString('en-PH'):''}</div></div><div class="amount">${peso(e.amount)}</div>${isSuper()?`<button class="btn danger small" data-del-expense="${e.id}">Delete</button>`:''}</div>`}).join(''):'<div class="empty">No expenses yet.</div>'}</section>`:moneyTab==='balances'?`<section class="card"><h2>Current balances</h2>${t.people.map(p=>`<div class="item row">${av(p)}<div class="grow"><b>${esc(p.name)}</b></div><b class="balance ${b[p.id]<-.01?'owe':b[p.id]>.01?'get':''}">${b[p.id]<-.01?'owes '+peso(-b[p.id]):b[p.id]>.01?'gets '+peso(b[p.id]):'settled'}</b></div>`).join('')}</section><section class="card"><h2>Settle up</h2>${pairs.length?pairs.map(x=>`<div class="item"><b>${esc(person(x.from)?.name)} → ${esc(person(x.to)?.name)}</b><span class="amount" style="float:right">${peso(x.amount)}</span></div>`).join(''):'<div class="empty">Everyone is settled.</div>'}</section>`:moneyTab==='payments'?`<section class="card"><div class="row between"><h2 style="margin:0">Payments</h2><button class="btn" data-act="payment">＋ Payment</button></div>${t.payments.length?t.payments.slice().reverse().map(p=>`<div class="item row">${av(person(p.from))}<div class="grow"><b>${esc(person(p.from)?.name)} paid ${esc(person(p.to)?.name)}</b><div class="muted">${fmt(p.date)} · ${esc(p.method||'Payment')}</div></div><div class="amount">${peso(p.amount)}</div>${isSuper()?`<button class="btn danger small" data-del-payment="${p.id}">Delete</button>`:''}</div>`).join(''):'<div class="empty">No settlement payments recorded.</div>'}</section>`:`<section class="card"><h2>Activity history</h2>${t.history.length?t.history.map(h=>`<div class="item history"><b>${esc(h.text)}</b><div class="audit">${new Date(h.at).toLocaleString('en-PH')}</div></div>`).join(''):'<div class="empty">No activity yet.</div>'}</section>`}`}
function memberBreakdown(t,p){let acts=t.program.filter(a=>a.by===p.id||a.by===p.name),items=t.items.filter(x=>x.by===p.id||x.by===p.name),paid=t.expenses.filter(e=>e.payer===p.id),shared=t.expenses.filter(e=>(e.shared||[]).includes(p.id)),pays=t.payments.filter(x=>x.from===p.id||x.to===p.id),b=balances(t)[p.id]||0;return `<div class="memberbreak"><div class="grid2"><div><span class="tiny">Activities</span><b style="display:block">${acts.length}</b></div><div><span class="tiny">Assigned / Bringing</span><b style="display:block">${items.length}</b></div><div><span class="tiny">Expenses Paid</span><b style="display:block">${peso(paid.reduce((s,e)=>s+Number(e.amount||0),0))}</b></div><div><span class="tiny">Current Balance</span><b class="balance ${b<-.01?'owe':b>.01?'get':''}" style="display:block">${b<-.01?'Owes '+peso(-b):b>.01?'Gets '+peso(b):'Settled'}</b></div></div>${acts.length?`<div class="item"><b>Program</b><div class="muted">${acts.map(a=>esc(a.title)+' · '+fmt(a.date)).join('<br>')}</div></div>`:''}${items.length?`<div class="item"><b>Needs / Potluck</b><div class="muted">${items.map(x=>esc(x.name)+(x.qty?' · '+esc(x.qty):'')).join('<br>')}</div></div>`:''}<div class="audit">${shared.length} shared expense(s) · ${pays.length} payment record(s)</div></div>`}
function group(t){return `<section class="row between"><div><h1 style="margin-bottom:3px">Group</h1><div class="muted">${t.people.length} traveler${t.people.length===1?'':'s'} · master member list for this trip</div></div><button class="btn" data-act="person">＋ Register Member</button></section><section class="card" style="margin-top:14px">${t.people.map(p=>`<div class="item"><div class="row">${av(p)}<div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.role||'Editor')}</div></div><button class="btn secondary small" data-profile="${p.id}">Profile</button><button class="btn secondary small" data-breakdown="${p.id}">Breakdown</button>${isSuper()&&p.id!==currentPerson()?.id?`<button class="btn danger small" data-del-person="${p.id}">Remove</button>`:''}</div><div id="break-${p.id}" style="display:none">${memberBreakdown(t,p)}</div></div>`).join('')}</section>`}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}function optionsPeople(selected){return trip().people.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}function checksPeople(selected=[]){return `<div class="checkrow">${trip().people.map(p=>`<label><input type="checkbox" name="shared" value="${p.id}" ${selected.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div>`}
function formExpense(pref={}){openModal('Add Expense',`<form id="expenseForm"><div class="field"><label>What did you buy/pay for?</label><input name="name" required value="${esc(pref.name||'')}" placeholder="e.g. Groceries"></div><div class="grid2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required value="${pref.amount||''}"></div><div class="field"><label>Date</label><input name="date" type="date" required value="${pref.date||isoToday()}"></div></div><div class="field"><label>Paid by</label><select name="payer">${optionsPeople(pref.payer||trip().people[0]?.id)}</select></div><div class="field"><label>Split with</label>${checksPeople(pref.shared||trip().people.map(p=>p.id))}<div style="margin-top:7px"><label><input type="checkbox" id="personalExpense"> Personal / don't split</label></div></div><div class="field"><label>Notes (optional)</label><textarea name="note"></textarea></div><button class="btn" style="width:100%">Save Expense</button></form>`);$('#personalExpense').addEventListener('change',e=>document.querySelectorAll('input[name=shared]').forEach(x=>{x.disabled=e.target.checked;if(e.target.checked)x.checked=false}));$('#expenseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),shared=[...e.target.querySelectorAll('input[name=shared]:checked')].map(x=>x.value),obj={id:uid(),name:f.get('name'),amount:Number(f.get('amount')),date:f.get('date'),payer:f.get('payer'),shared,note:f.get('note'),createdBy:currentPerson()?.name||'Member',updatedAt:new Date().toISOString()};trip().expenses.push(obj);log(`Expense added: ${obj.name} · ${peso(obj.amount)} · paid by ${person(obj.payer)?.name||'member'}`);closeModal();render()}}
function formActivity(){openModal('Add Activity',`<form id="activityForm"><div class="field"><label>Date</label><input name="date" type="date" required min="${trip().start||''}" max="${trip().end||''}" value="${trip().start||isoToday()}"></div><div class="grid2"><div class="field"><label>Start</label><input name="start" type="time" required></div><div class="field"><label>End (optional)</label><input name="end" type="time"></div></div><div class="field"><label>Activity</label><input name="title" required placeholder="Pickleball"></div><div class="field"><label>Location</label><input name="place" placeholder="Garden"></div><div class="field"><label>Added by</label><select name="by">${optionsPeople(currentPerson()?.id)}</select></div><button class="btn" style="width:100%">Add to Program</button></form>`);$('#activityForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:uid(),date:f.get('date'),start:f.get('start'),end:f.get('end'),title:f.get('title'),place:f.get('place'),by:f.get('by')};trip().program.push(o);log(`Program updated: ${o.title} · ${fmt(o.date)} ${timefmt(o.start)}`);closeModal();render()}}
function formItem(kind='potluck'){openModal(kind==='potluck'?"I'll Bring Something":'Add Needed Item',`<form id="itemForm"><input type="hidden" name="kind" value="${kind}"><div class="field"><label>${kind==='potluck'?'What will you bring?':'What do you need?'}</label><input name="name" required placeholder="${kind==='potluck'?'Baked Sushi':'Drinking water'}"></div><div class="grid2"><div class="field"><label>${kind==='potluck'?'Bringing by':'Assigned to (optional)'}</label><select name="by"><option value="">${kind==='potluck'?'Select member':'Unassigned'}</option>${optionsPeople(currentPerson()?.id)}</select></div><div class="field"><label>Quantity (optional)</label><input name="qty" placeholder="2 trays"></div></div><button class="btn" style="width:100%">Add</button></form>`);$('#itemForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:uid(),kind:f.get('kind'),name:f.get('name'),by:f.get('by'),qty:f.get('qty'),status:kind==='potluck'?'planned':'needed',cost:0};trip().items.push(o);log(`${kind==='potluck'?'Potluck':'Needed item'} added: ${o.name}${o.by?' by '+memberName(o.by):''}`);closeModal();render()}}
function formPayment(){openModal('Record Payment',`<form id="paymentForm"><div class="grid2"><div class="field"><label>Paid by</label><select name="from">${optionsPeople()}</select></div><div class="field"><label>Paid to</label><select name="to">${optionsPeople()}</select></div></div><div class="grid2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Date</label><input name="date" type="date" required value="${isoToday()}"></div></div><div class="field"><label>Payment method</label><select name="method"><option>GCash</option><option>Cash</option><option>Bank Transfer</option><option>Other</option></select></div><button class="btn" style="width:100%">Record Payment</button></form>`);$('#paymentForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('from')===f.get('to'))return alert('Choose two different people.');let o={id:uid(),from:f.get('from'),to:f.get('to'),amount:Number(f.get('amount')),date:f.get('date'),method:f.get('method')};trip().payments.push(o);log(`Payment recorded: ${person(o.from)?.name} paid ${person(o.to)?.name} ${peso(o.amount)}`);closeModal();render()}}
function formPerson(){openModal('Register Member',`<form id="personForm"><p class="muted">No email needed. Create a name, optional photo, and 4–6 digit PIN.</p><div class="field"><label>Display name</label><input name="name" required autocomplete="off"></div><div class="field"><label>PIN</label><input class="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" required placeholder="••••"></div><div class="field"><label>Avatar / photo (optional)</label><input name="avatar" type="file" accept="image/*"></div><div class="field"><label>Role</label><select name="role"><option>Editor</option><option>Viewer</option></select></div><button class="btn" style="width:100%">Create Account</button></form>`);$('#personForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=e.target.avatar.files[0],avatar=file?await fileData(file):'',pin=String(f.get('pin'));if(!/^\d{4,6}$/.test(pin))return alert('Use a 4–6 digit PIN.');let o={id:uid(),name:f.get('name').trim(),role:f.get('role'),avatar,pin};trip().people.push(o);data.currentUser=o.id;log(`Member registered: ${o.name}`);closeModal();render()}}
function joinView(t){return `<section class="card joinhero"><div class="avatar">＋</div><div class="eyebrow">${esc(t.name)}</div><h1>Join this trip</h1><p class="muted">Create your own trip profile. No email, Google or Facebook account needed.</p><button class="btn" data-act="person">Create My Account</button><button class="btn secondary" style="margin-left:6px" id="existingLogin">I already joined</button></section>`}
function accountChooser(){let t=trip();openModal('Your Trip Account',`<p class="muted">Choose your profile and enter your PIN, or create a new account.</p><form id="loginForm"><div class="field"><label>Profile</label><select name="id">${t.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>PIN</label><input class="pin" name="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div><button class="btn" style="width:100%">Enter Trip</button></form><div class="actions"><button class="btn secondary" id="createAccountHere">Create New Account</button></div>`);$('#createAccountHere').onclick=formPerson;$('#loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=t.people.find(x=>x.id===f.get('id'));if(p?.pin&&p.pin!==String(f.get('pin')))return alert('Incorrect PIN.');data.currentUser=p.id;save();closeModal();render()}}
function profile(id){let p=person(id);openModal('Traveler Profile',`<form id="profileForm"><div class="row" style="margin-bottom:15px">${av(p)}<div><b>${esc(p.name)}</b><div class="muted">${esc(p.role)}</div></div></div><div class="field"><label>Name</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Role</label><select name="role"><option ${p.role==='Super Admin'?'selected':''}>Super Admin</option><option ${p.role==='Editor'?'selected':''}>Editor</option><option ${p.role==='Viewer'?'selected':''}>Viewer</option></select></div><div class="field"><label>Change avatar/photo</label><input name="avatar" type="file" accept="image/*"></div><button class="btn" style="width:100%">Save Profile</button></form>`);$('#profileForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=e.target.avatar.files[0];p.name=f.get('name');p.role=f.get('role');if(file)p.avatar=await fileData(file);log(`Profile updated: ${p.name}`);closeModal();render()}}
function fileData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function editTrip(){let t=trip(),oldStart=t.start,oldEnd=t.end;openModal('Edit Trip',`<form id="tripEditForm"><div class="field"><label>Trip name</label><input name="name" required value="${esc(t.name)}"></div><div class="field"><label>Destination</label><input name="place" value="${esc(t.place||'')}"></div><div class="grid2"><div class="field"><label>Start date</label><input name="start" type="date" required value="${t.start||''}"></div><div class="field"><label>End date</label><input name="end" type="date" required value="${t.end||''}"></div></div><button class="btn" style="width:100%">Save Trip</button></form>`);$('#tripEditForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),ns=f.get('start'),ne=f.get('end');if(ne<ns)return alert('End date cannot be before start date.');let changed=ns!==oldStart||ne!==oldEnd;if(changed&&t.program.length&&oldStart){let move=confirm('Trip dates changed. Move existing program with the trip?\n\nOK = Move activities with the trip\nCancel = Keep original activity dates');if(move){let delta=Math.round((new Date(ns)-new Date(oldStart))/864e5);t.program.forEach(a=>{let d=new Date(a.date+'T00:00:00');d.setDate(d.getDate()+delta);a.date=d.toISOString().slice(0,10)})}}t.name=f.get('name');t.place=f.get('place');t.start=ns;t.end=ne;log(`Trip details updated${changed?' · dates '+fmt(ns)+' – '+fmt(ne):''}`);closeModal();render()}}
function newTrip(){openModal('New Trip',`<form id="newTripForm"><div class="field"><label>Trip name</label><input name="name" required placeholder="Amarisa Getaway"></div><div class="field"><label>Destination</label><input name="place"></div><div class="grid2"><div class="field"><label>Start</label><input name="start" type="date" required></div><div class="field"><label>End</label><input name="end" type="date" required></div></div><div class="grid2"><div class="field"><label>Your name (Super Admin)</label><input name="adminName" required></div><div class="field"><label>Your 4–6 digit PIN</label><input class="pin" name="adminPin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required></div></div><button class="btn" style="width:100%">Create Trip</button></form>`);$('#newTripForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('end')<f.get('start'))return alert('End date cannot be before start date.');let id=uid(),adminId=uid();data.trips[id]=normalize({id,name:f.get('name'),place:f.get('place'),start:f.get('start'),end:f.get('end'),people:[{id:adminId,name:f.get('adminName').trim(),role:'Super Admin',avatar:'',pin:String(f.get('adminPin'))}],program:[],items:[],expenses:[],payments:[],sponsors:[],history:[{id:uid(),text:'Trip created',at:new Date().toISOString()}]});data.active=id;data.currentUser=adminId;save();closeModal();render()}}
function buyItem(id){let x=trip().items.find(i=>i.id===id);openModal('Mark as Bought',`<form id="buyForm"><p><b>${esc(x.name)}</b></p><div class="grid2"><div class="field"><label>Actual cost</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Bought by</label><select name="payer">${optionsPeople()}</select></div></div><div class="field"><label>Expense treatment</label><select name="treat"><option value="shared">Shared expense</option><option value="free">Sponsored / brought from home — no expense</option><option value="personal">Personal — don't split</option></select></div><button class="btn" style="width:100%">Confirm Bought</button></form>`);$('#buyForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),amt=Number(f.get('amount')),treat=f.get('treat');x.status='bought';x.cost=amt;x.by=f.get('payer')||x.by;if(treat!=='free'&&amt>0){trip().expenses.push({id:uid(),name:x.name,amount:amt,date:isoToday(),payer:f.get('payer'),shared:treat==='personal'?[]:trip().people.map(p=>p.id),note:'Generated from '+(x.kind==='potluck'?'potluck':'needed item'),createdBy:memberName(x.by),updatedAt:new Date().toISOString()});log(`${x.name} marked bought · expense generated ${peso(amt)}`)}else log(`${x.name} marked bought · no shared expense`);closeModal();render()}}
function removeActivity(id){if(!isSuper())return;let x=trip().program.find(a=>a.id===id);if(x&&confirm(`Delete activity "${x.title}"?`)){trip().program=trip().program.filter(a=>a.id!==id);log(`Activity deleted by Super Admin: ${x.title}`);render()}}
function removeItem(id){if(!isSuper())return;let x=trip().items.find(a=>a.id===id);if(x&&confirm(`Delete "${x.name}"?`)){trip().items=trip().items.filter(a=>a.id!==id);log(`Item deleted by Super Admin: ${x.name}`);render()}}
function removeExpense(id){if(!isSuper())return;let x=trip().expenses.find(a=>a.id===id);if(x&&confirm(`Delete expense "${x.name}"? Balances will be recalculated.`)){trip().expenses=trip().expenses.filter(a=>a.id!==id);trip().items.forEach(i=>{if(i.expenseId===id)i.expenseId=null});log(`Expense deleted by Super Admin: ${x.name} · balances recalculated`);render()}}
function removePayment(id){if(!isSuper())return;let x=trip().payments.find(a=>a.id===id);if(x&&confirm(`Delete this payment of ${peso(x.amount)}? Balances will be recalculated.`)){trip().payments=trip().payments.filter(a=>a.id!==id);log(`Payment deleted by Super Admin: ${peso(x.amount)} · balances recalculated`);render()}}
function removePerson(id){if(!isSuper())return;let p=person(id);if(!p)return;if(p.role==='Super Admin')return alert('The Super Admin account cannot be removed here.');let refs=trip().expenses.some(e=>e.payer===id||(e.shared||[]).includes(id))||trip().payments.some(x=>x.from===id||x.to===id);if(refs)return alert(`${p.name} has financial records. Keep this member in the trip so expense/payment history and balances remain accurate.`);if(confirm(`Remove ${p.name} from this trip?`)){trip().people=trip().people.filter(x=>x.id!==id);trip().items.forEach(x=>{if(x.by===id)x.by=''});trip().program.forEach(x=>{if(x.by===id)x.by=p.name});log(`Member removed by Super Admin: ${p.name}`);render()}}
function toggleBreakdown(id){let el=document.getElementById('break-'+id);if(el)el.style.display=el.style.display==='none'?'block':'none'}
function settings(){let t=trip();openModal('Trip Settings',`<div class="card"><b>${esc(t.name)}</b><div class="muted">${fmt(t.start)} – ${fmt(t.end)}</div><div class="actions"><button class="btn secondary" id="editTripSettings">Edit trip & dates</button></div></div><p class="muted">Trip status is automatic based on the dates. Your records remain attached to this trip when it is rescheduled.</p>`);$('#editTripSettings').onclick=editTrip}
function bindView(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(a==='expense')formExpense();if(a==='potluck')formItem('potluck');if(a==='need')formItem('need');if(a==='activity')formActivity();if(a==='payment')formPayment();if(a==='person')formPerson();if(a==='edittrip')editTrip()});document.querySelectorAll('[data-mtab]').forEach(b=>b.onclick=()=>{moneyTab=b.dataset.mtab;render()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>profile(b.dataset.profile));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyItem(b.dataset.buy));document.querySelectorAll('[data-del-activity]').forEach(b=>b.onclick=()=>removeActivity(b.dataset.delActivity));document.querySelectorAll('[data-del-item]').forEach(b=>b.onclick=()=>removeItem(b.dataset.delItem));document.querySelectorAll('[data-del-expense]').forEach(b=>b.onclick=()=>removeExpense(b.dataset.delExpense));document.querySelectorAll('[data-del-payment]').forEach(b=>b.onclick=()=>removePayment(b.dataset.delPayment));document.querySelectorAll('[data-del-person]').forEach(b=>b.onclick=()=>removePerson(b.dataset.delPerson));document.querySelectorAll('[data-breakdown]').forEach(b=>b.onclick=()=>toggleBreakdown(b.dataset.breakdown));let el=$('#existingLogin');if(el)el.onclick=accountChooser}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;view=b.dataset.v;render()});$('#tripSelect').onchange=e=>{data.active=e.target.value;data.currentUser=null;save();render()};$('#newTripBtn').onclick=newTrip;$('#settingsBtn').onclick=settings;$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();if(location.protocol!=='file:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();
</script></body></html>
